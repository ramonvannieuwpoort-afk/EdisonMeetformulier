# Zet apps-script/Code.gs automatisch live in je Google Apps Script
# zodra er iets in de map apps-script verandert.
# Eenmalig instellen: zie STAPPENPLAN-AUTOMATISCH.md (deel 3).
name: Apps Script bijwerken

on:
  push:
    branches: [main]
    paths: ['apps-script/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controleren of de koppeling is ingesteld
        id: check
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::Nog niet ingesteld (CLASPRC_JSON, SCRIPT_ID en DEPLOYMENT_ID ontbreken). Niets gedaan."
            echo "klaar=nee" >> "$GITHUB_OUTPUT"
          else
            echo "klaar=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.klaar == 'ja'
        with:
          node-version: 20

      - name: Code naar Apps Script sturen en nieuwe versie live zetten
        if: steps.check.outputs.klaar == 'ja'
        working-directory: apps-script
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
